aid: tenex
name: Tenex
description: >-
  Tenex is a PropTech platform for real estate and hospitality operators across
  the Gulf Cooperation Council (GCC) region, offering an all-in-one suite that
  unifies property management, tenant and landlord experience, facility and asset
  management, real estate accounting, VR for off-plan developments, and a
  hospitality guest experience app. Trusted across 500+ buildings and
  communities, it advertises integrations with ZATCA, SAP, Oracle, and Microsoft
  Dynamics to automate compliance and unify operations. Tenex is backed by 500
  Global and the Sanabil 500 MENA Seed Accelerator. As of this enrichment pass no
  public API, developer portal, or machine-readable API surface is published.
